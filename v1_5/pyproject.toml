[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobpulse-cr-v15"
version = "1.5.0"
description = "Desarrollo aislado de JobPulse CR 1.5"
requires-python = ">=3.11"
dependencies = [
    "lxml>=4.9",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "httpx[http2]>=0.27",
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.0",
    "torch>=2.3",
    "python-dotenv>=1.0",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
ia = [
    "openai>=1.30",  # compatible con OpenRouter, NVIDIA, Ollama, etc.
]

[project.scripts]
jobpulse-v15 = "jobpulse_v15.cli:main"
jobpulse-v15-ui = "jobpulse_v15.ui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
